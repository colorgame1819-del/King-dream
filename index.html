        #pageContent .hero .sub { font-size: 1rem; max-width: 560px; color: var(--muted); font-weight: 500; line-height: 1.7; text-shadow: 0 1px 16px rgba(0,0,0,1); }
        #pageContent .hero .sub strong { color: var(--lime); font-weight: 700; text-shadow: 0 0 12px rgba(204,255,0,0.5); }

        #pageContent .hero-stats {
            display: flex; width: 100%; border: 1px solid var(--line);
            background: rgba(10,0,12,0.5); border-radius: 16px; overflow: hidden;
            backdrop-filter: blur(3px);
        }
        #pageContent .hero-stats .stat-item {
            flex: 1; display: flex; flex-direction: column; gap: 4px; padding: 15px 6px;
            border-right: 1px solid var(--line);
        }
        #pageContent .hero-stats .stat-item:last-child { border-right: none; }
        #pageContent .hero-stats .stat-item .label { font-size: 0.62rem; letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); font-family: 'Rajdhani', sans-serif; font-weight: 600; }
        #pageContent .hero-stats .stat-item .value { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.05rem; color: var(--cyan); text-shadow: 0 0 14px rgba(0,240,255,0.6); }
        #pageContent .hero-stats .stat-item.neutral .value { color: var(--ink); text-shadow: 0 0 14px rgba(255,255,255,0.4); }
        #pageContent .hero-stats .stat-item.gold .value { color: var(--pink); text-shadow: 0 0 14px rgba(255,32,121,0.6); }

        /* Fade-in on load — pure CSS, no JS required (the original relied on a
           script adding a class, which never runs once pasted into the page). */
        #pageContent .reveal { animation: pageReveal 0.6s ease forwards; opacity: 0; }
        #pageContent .feed-tag.reveal { animation-delay: .05s; }
        #pageContent .profile-avatar-wrapper.reveal { animation-delay: .15s; }
        #pageContent .channel-name.reveal { animation-delay: .25s; }
        #pageContent .btn-group.reveal { animation-delay: .35s; }
        #pageContent .sub.reveal { animation-delay: .45s; }
        #pageContent .hero-stats.reveal { animation-delay: .55s; }
        @keyframes pageReveal { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        @media (max-width: 640px) {
            #pageContent .hero-outer { padding: 0; }
            #pageContent .hero { max-width: 100%; width: 100%; border-left: none; border-right: none; }
            #pageContent .hero-stats .stat-item .value { font-size: 0.95rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            #pageContent *, #pageContent *::before, #pageContent *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
        }

<script>
  // ---- Read config from body attributes (this is what makes export safe —
  // nothing here ever gets rewritten as script text; it's just DOM attributes,
  // which cloneNode() carries over automatically) ----
  function getConfig(){
    var b = document.body;
    return {
      pixelId: b.getAttribute('data-pixel-id') || '',
      telegramLink: b.getAttribute('data-telegram-link') || '',
      redirectSeconds: parseInt(b.getAttribute('data-redirect-seconds'), 10) || 10,
      redirectEnabled: b.getAttribute('data-redirect-enabled') === 'true',
      currency: b.getAttribute('data-currency') || 'USD',
      eventValue: parseFloat(b.getAttribute('data-event-value')) || 0
    };
  }

  var isEditorMode = !!document.getElementById('editPanel');
  var CONFIG = getConfig();

  // ---- Every <a> / <button> inside the page is treated as a clickable CTA:
  // it gets click tracking, and its own editable link in the panel. ----
  function getPageButtons(){
    var pc = document.getElementById('pageContent') || document.body;
    return Array.prototype.slice.call(pc.querySelectorAll('a, button'));
  }

  var countdownEl0 = document.getElementById('countdown');
  if(countdownEl0) countdownEl0.textContent = CONFIG.redirectSeconds;

  // ---- Tracking (real events only fire when NOT in editor mode AND a Pixel ID is set) ----
  function genEventId(){ return 'evt_' + Date.now() + '_' + Math.random().toString(36).slice(2); }
  function trackLead(){
    if(isEditorMode || !CONFIG.pixelId || sessionStorage.getItem('lead_fired')) return;
    fbq('track', 'Lead', {value: CONFIG.eventValue, currency: CONFIG.currency}, {eventID: genEventId()});
    sessionStorage.setItem('lead_fired', '1');
  }
  function trackSubscribe(){
    if(isEditorMode || !CONFIG.pixelId || sessionStorage.getItem('subscribe_fired')) return;
    fbq('track', 'Subscribe', {value: CONFIG.eventValue, currency: CONFIG.currency}, {eventID: genEventId()});
    sessionStorage.setItem('subscribe_fired', '1');
  }
  function wireJoinButtons(){
    getPageButtons().forEach(function(btn, i){
      btn.setAttribute('data-btn-index', i);
      if(btn.__wired) return;
      btn.__wired = true;
      btn.addEventListener('click', function(e){
        var target = this.getAttribute('href');
        if(!target || target === '#') return;
        e.preventDefault();
        trackLead();
        trackSubscribe();
        window.location.href = target;
      });
    });
  }
  wireJoinButtons();

  // Sync any repeated/mirrored profile photo spots (header, footer, etc.) from the
  // single embedded copy on page load, so the image only needs to be stored once.
  (function syncLogoMirrors(){
    var li = document.getElementById('logoImg');
    if(!li) return;
    var src = li.getAttribute('src');
    if(!src) return;
    document.querySelectorAll('.logoImg-mirror').forEach(function(m){
      if(!m.getAttribute('src')) m.src = src;
    });
  })();

  // ---- Optional decorative canvas background. Lives here (not inside the
  // editable Page HTML) so it's a genuine part of the file's real source —
  // real <script> tags execute normally on page load, unlike ones inserted
  // live via the Page HTML box. Re-runs after every Page HTML edit too, in
  // case a pasted design brings its own #synthCanvas along. ----
  var synthCanvasStarted = false;
  function initSynthCanvas(){
    var canvas = document.getElementById('synthCanvas');
    if(!canvas || synthCanvasStarted) return;
    synthCanvasStarted = true;
    var ctx = canvas.getContext('2d');
    var W, H, offset = 0, particles = [], animationId;

    function resize(){
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
      initParticles();
    }
    function initParticles(){
      particles = [];
      var count = Math.max(40, Math.floor((W * H) / 20000));
      var COLORS = ['255,32,121', '0,240,255', '204,255,0', '176,38,255'];
      for(var i = 0; i < count; i++){
        particles.push({
          x: Math.random() * W,
          y: Math.random() * H,
          r: 0.8 + Math.random() * 2,
          speed: 0.3 + Math.random() * 0.9,
          c: COLORS[i % COLORS.length]
        });
      }
    }
    window.addEventListener('resize', resize);
    resize();

    function drawSun(horizonY){
      var cx = W * 0.5;
      var r = Math.min(W, H) * 0.28;
      var grad = ctx.createRadialGradient(cx, horizonY, 0, cx, horizonY, r);
      grad.addColorStop(0, 'rgba(255,32,121,0.55)');
      grad.addColorStop(0.5, 'rgba(176,38,255,0.28)');
      grad.addColorStop(1, 'rgba(176,38,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, horizonY, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.save();
      ctx.beginPath();
      ctx.arc(cx, horizonY, r * 0.62, 0, Math.PI * 2);
      ctx.clip();
      for(var i = 0; i < 6; i++){
        var y = horizonY - r * 0.62 + (i * r * 1.24) / 6;
        ctx.fillStyle = 'rgba(3,0,4,0.85)';
        ctx.fillRect(cx - r, y, r * 2, r * 0.09);
      }
      ctx.restore();
    }

    function drawGrid(horizonY){
      ctx.strokeStyle = 'rgba(0,240,255,0.4)';
      ctx.lineWidth = 1;
      var vanishX = W * 0.5;
      var spread = W * 0.9;
      for(var i = -12; i <= 12; i++){
        ctx.beginPath();
        ctx.moveTo(vanishX + i * 14, horizonY);
        ctx.lineTo(vanishX + i * spread, H);
        ctx.strokeStyle = 'rgba(255,32,121,' + (0.32 - Math.abs(i) * 0.012) + ')';
        ctx.stroke();
      }
      var rows = 14;
      for(var j = 0; j < rows; j++){
        var p = ((j + offset) % rows) / rows;
        var y = horizonY + Math.pow(p, 2.6) * (H - horizonY);
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(W, y);
        ctx.strokeStyle = 'rgba(0,240,255,' + (0.5 * p) + ')';
        ctx.stroke();
      }
    }

    function drawParticles(){
      for(var i = 0; i < particles.length; i++){
        var p = particles[i];
        p.y -= p.speed;
        if(p.y < -5){ p.y = H + 5; p.x = Math.random() * W; }
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(' + p.c + ',0.8)';
        ctx.shadowColor = 'rgba(' + p.c + ',1)';
        ctx.shadowBlur = 8;
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    function draw(){
      if(!document.getElementById('synthCanvas')){
        cancelAnimationFrame(animationId);
        synthCanvasStarted = false;
        return;
      }
      ctx.clearRect(0, 0, W, H);
      var horizonY = H * 0.42;
      drawSun(horizonY);
      drawGrid(horizonY);
      drawParticles();
      offset += 0.012;
      animationId = requestAnimationFrame(draw);
    }
    animationId = requestAnimationFrame(draw);
    document.addEventListener('visibilitychange', function(){
      if(document.hidden) cancelAnimationFrame(animationId);
      else animationId = requestAnimationFrame(draw);
    });
  }
  initSynthCanvas();

  if(!isEditorMode){
    if(CONFIG.pixelId){
      var fbNoScript = document.getElementById('fbNoScript');
      if(fbNoScript){ fbNoScript.src = 'https://www.facebook.com/tr?id=' + encodeURIComponent(CONFIG.pixelId) + '&ev=PageView&noscript=1'; }
      fbq('init', CONFIG.pixelId);
      fbq('track', 'PageView');
    }
    if(CONFIG.redirectEnabled){
      (function(){
        var secondsLeft = CONFIG.redirectSeconds;
        var countdownEl = document.getElementById('countdown');
        var timer = setInterval(function(){
          secondsLeft--;
          if(secondsLeft <= 0){
            clearInterval(timer);
            trackLead();
            trackSubscribe();
            window.location.href = CONFIG.telegramLink;
          } else {
            if(countdownEl) countdownEl.textContent = secondsLeft;
          }
        }, 1000);
      })();
    } else {
      var rl = document.getElementById('redirectLine');
      if(rl) rl.remove();
    }
  }


  // ================= EDIT PANEL (only runs while #editPanel exists) =================
  if(isEditorMode){
    function updateLogoPlaceholder(){
      var li = document.getElementById('logoImg');
      var ph = document.getElementById('logoPlaceholder');
      if(!li || !ph) return;
      ph.style.display = li.getAttribute('src') ? 'none' : 'flex';
    }

    var logoImgInit = document.getElementById('logoImg');
    var logoPreviewInit = document.getElementById('logoPreview');
    if(logoImgInit && logoImgInit.getAttribute('src')){
      // A real photo is already baked into the page — mirror it into the
      // small preview box instead of wiping it back to blank.
      logoPreviewInit.src = logoImgInit.getAttribute('src');
    } else {
      logoPreviewInit.src = '';
    }
    updateLogoPlaceholder();
    document.getElementById('telegramInput').value = CONFIG.telegramLink;
    document.getElementById('pixelInput').value = CONFIG.pixelId;
    document.getElementById('eventValueInput').value = CONFIG.eventValue;
    document.getElementById('currencyInput').value = CONFIG.currency;
    document.getElementById('customHtmlInput').value = document.getElementById('pageContent').innerHTML.trim();

    function applyTelegramLink(){
      var val = document.getElementById('telegramInput').value.trim();
      var s = document.getElementById('status_telegram');
      if(!val){ s.textContent = 'Enter a link first.'; s.className = 'field-status err'; return; }
      document.body.setAttribute('data-telegram-link', val);
      CONFIG.telegramLink = val;
      var buttons = getPageButtons();
      buttons.forEach(function(btn){ btn.setAttribute('href', val); });
      buildButtonPanel();
      if(buttons.length){
        s.textContent = 'Saved — applied to all ' + buttons.length + ' button' + (buttons.length > 1 ? 's' : '') + '. Set different links per button under "Buttons & links".';
        s.className = 'field-status ok';
      } else {
        s.textContent = 'Saved — no buttons or links found on the current page yet.';
        s.className = 'field-status err';
      }
    }

    function buildButtonPanel(){
      var list = document.getElementById('buttonList');
      if(!list) return;
      list.innerHTML = '';
      var buttons = getPageButtons();
      if(!buttons.length){
        list.innerHTML = '<div class="field-card"><div class="field-status">No buttons or links found on the current page.</div></div>';
        return;
      }
      buttons.forEach(function(btn, i){
        var label = (btn.textContent || '').replace(/\s+/g, ' ').trim().slice(0, 40) || ('Button ' + (i+1));
        var href = btn.getAttribute('href') || '';
        var card = document.createElement('div');
        card.className = 'field-card';
        card.innerHTML =
          '<label>Button ' + (i+1) + ' — ' + label.replace(/</g,'&lt;') + '</label>' +
          '<input type="text" id="btnlink_' + i + '" placeholder="https://t.me/..." value="' + href.replace(/"/g,'&quot;') + '">' +
          '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">' +
            '<button class="act" onclick="applyButtonLink(' + i + ')">Apply</button>' +
            '<button class="sec" onclick="useTelegramForButton(' + i + ')">Use Telegram Link</button>' +
          '</div>' +
          '<div class="field-status" id="statusbtn_' + i + '"></div>';
        list.appendChild(card);
      });
    }

    function applyButtonLink(i){
      var input = document.getElementById('btnlink_' + i);
      var s = document.getElementById('statusbtn_' + i);
      var btn = getPageButtons()[i];
      if(!btn){ s.textContent = 'Button no longer on the page.'; s.className = 'field-status err'; return; }
      var val = input.value.trim();
      if(!val){ s.textContent = 'Enter a link first.'; s.className = 'field-status err'; return; }
      btn.setAttribute('href', val);
      s.textContent = 'Linked.';
      s.className = 'field-status ok';

    function useTelegramForButton(i){
      var input = document.getElementById('btnlink_' + i);
      input.value = document.body.getAttribute('data-telegram-link') || '';
      applyButtonLink(i);
    }

    function extractPixelId(raw){
      // Accepts either a bare Pixel ID or the full Meta Pixel <script> snippet and pulls the ID out of either.
      var m = raw.match(/fbq\(\s*['"]init['"]\s*,\s*['"](\d{10,20})['"]/);
      if(m) return m[1];
      m = raw.match(/\b(\d{10,20})\b/);
      if(m) return m[1];
      return raw.trim();
    }

    function applyEventValue(){
      var valRaw = document.getElementById('eventValueInput').value.trim();
      var curRaw = document.getElementById('currencyInput').value.trim().toUpperCase();
      var s = document.getElementById('status_eventvalue');
      var val = parseFloat(valRaw);
      if(isNaN(val)) val = 0;
      var cur = curRaw || 'USD';
      document.body.setAttribute('data-event-value', val);
      document.body.setAttribute('data-currency', cur);
      CONFIG.eventValue = val;
      CONFIG.currency = cur;
      document.getElementById('eventValueInput').value = val;
      document.getElementById('currencyInput').value = cur;
      s.textContent = 'Saved — Lead/Subscribe events will send value ' + val + ' ' + cur + '.';
      s.className = 'field-status ok';
    }

    function applyPixelId(){
      var raw = document.getElementById('pixelInput').value.trim();
      var s = document.getElementById('status_pixel');
      if(!raw){ s.textContent = 'Enter a Pixel ID first.'; s.className = 'field-status err'; return; }
      var val = extractPixelId(raw);
      document.body.setAttribute('data-pixel-id', val);
      var fbNoScript = document.getElementById('fbNoScript');
      if(fbNoScript){
        fbNoScript.src = 'https://www.facebook.com/tr?id=' + encodeURIComponent(val) + '&ev=PageView&noscript=1';
      }
      document.getElementById('pixelInput').value = val;
      s.textContent = (val !== raw) ? 'Detected Pixel ID ' + val + ' inside the pasted code and saved it.' : 'Saved.';
      s.className = 'field-status ok';

    document.getElementById('logoUpload').addEventListener('change', function(e){
      var file = e.target.files[0];

      if(!file) return;

      reader.onload = function(evt){
        var dataUrl = evt.target.result;

          s.textContent = 'Image loaded, but there\'s no element with id="logoImg" on the current page to show it in.';
          s.className = 'field-status err';
        } else {
          var mirrorNote = mirrors.length ? (' Also updated ' + mirrors.length + ' repeated copy' + (mirrors.length > 1 ? 'ies' : '') + ' elsewhere on the page.') : '';
          s.textContent = ((file.size > 3*1024*1024) ? 'Loaded, but large (>3MB) — final file will be big.' : 'Image loaded.') + mirrorNote;
          s.className = (file.size > 3*1024*1024) ? 'field-status err' : 'field-status ok';
        }
      };

    });

    var FIELD_LABELS = {
      badge: "Trust badge text", headline: "Channel name", subtitle: "Subtitle / tagline",
      features: "Features line", ctaText: "Join button text",
      redirectPrefix: "Redirect text (before number)", redirectSuffix: "Redirect text (after number)",
      stat1Value: "Stat 1 — value", stat1Label: "Stat 1 — label",
      stat2Value: "Stat 2 — value", stat2Label: "Stat 2 — label",
      stat3Value: "Stat 3 — value", stat3Label: "Stat 3 — label"
    };

    function buildFieldPanel(){
      var list = document.getElementById('fieldList');
      list.innerHTML = '';
      var seen = {};
      var orderedIds = Object.keys(FIELD_LABELS).concat(
        Array.prototype.slice.call(document.querySelectorAll('[data-field]'))
          .map(function(el){ return el.getAttribute('data-field'); })
          .filter(function(id){ return !FIELD_LABELS[id]; })
      );
      orderedIds.forEach(function(fieldId){
        if(seen[fieldId]) return;
        seen[fieldId] = true;
        var el = document.querySelector('[data-field="' + fieldId + '"]');
        if(!el) return;
        var label = FIELD_LABELS[fieldId] || (/^autoText\d+$/.test(fieldId) ? 'Text ' + fieldId.replace('autoText','') : fieldId);
        var card = document.createElement('div');
        card.className = 'field-card';
        card.innerHTML =
          '<label>' + label + '</label>' +
          '<textarea rows="2" id="ta_' + fieldId + '">' + el.textContent.trim() + '</textarea>' +
          '<div style="display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;">' +
            '<button class="act" onclick="applyField(\'' + fieldId + '\')">Apply</button>' +
            '<button class="sec" onclick="translateField(\'' + fieldId + '\',\'ta\')">Tamil</button>' +
            '<button class="sec" onclick="translateField(\'' + fieldId + '\',\'ta-en\')">Tanglish</button>' +
            '<button class="clr" onclick="clearField(\'' + fieldId + '\')">Clear</button>' +
          '</div>' +
          '<div class="field-status" id="status_' + fieldId + '"></div>';
        list.appendChild(card);
      });
    }

    function rebindPageContent(){
      // After a raw HTML swap, re-wire the pieces our JS depends on.
      wireJoinButtons();
      initSynthCanvas();
      var cd = document.getElementById('countdown');
      if(cd) cd.textContent = CONFIG.redirectSeconds;
      var li = document.getElementById('logoImg');
      var lp = document.getElementById('logoPreview');
      if(li && lp && lp.src){
        li.src = lp.src;
        document.querySelectorAll('.logoImg-mirror').forEach(function(m){ m.src = lp.src; });
      }
      updateLogoPlaceholder();
      buildButtonPanel();
      buildFieldPanel();
    }

    function autoTagTextFields(container){
      var skipTags = {SCRIPT:1, STYLE:1, NOSCRIPT:1, SVG:1, PATH:1};
      var counter = 1;

      // Collect every meaningful text node first (walking live would break as we wrap).
      var walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT, {
        acceptNode: function(node){
          if(!node.nodeValue || !node.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
          var p = node.parentNode;
          while(p && p !== container){
            if(skipTags[p.tagName]) return NodeFilter.FILTER_REJECT;
            p = p.parentNode;
          }
          return NodeFilter.FILTER_ACCEPT;
        }
      });
      var textNodes = [];
      var n;
      while((n = walker.nextNode())) textNodes.push(n);

      textNodes.forEach(function(node){
        var parent = node.parentNode;
        // If this text node is the parent's ONLY content, tag the parent directly —
        // keeps the original element and its styling intact.
        var parentIsSoleOwner = parent.childNodes.length === 1 && parent !== container;
        if(parentIsSoleOwner){
          if(parent.hasAttribute('data-field')) return;
          parent.setAttribute('data-field', 'autoText' + counter++);
        } else {
          // Mixed content (text sitting next to child elements) — wrap just this
          // text in a span so it becomes independently editable.
          var span = document.createElement('span');
          span.setAttribute('data-field', 'autoText' + counter++);
          span.textContent = node.nodeValue;
          parent.replaceChild(span, node);
        }
      });
    }

    async function redesignFromScreenshot(){
      var fileInput = document.getElementById('aiScreenshotInput');
      var s = document.getElementById('status_airedesign');
      var btn = document.getElementById('aiRedesignBtn');
      var file = fileInput.files[0];
      if(!file){ s.textContent = 'Choose a screenshot first.'; s.className = 'field-status err'; return; }
      btn.disabled = true;
      s.textContent = 'Generating from the screenshot… this can take up to 20 seconds.';
      s.className = 'field-status';
      try{
        var base64 = await new Promise(function(resolve, reject){
          var r = new FileReader();
          r.onload = function(){ resolve(r.result.split(',')[1]); };
          r.onerror = function(){ reject(new Error('Could not read that file')); };
          r.readAsDataURL(file);
        });
        var mediaType = file.type || 'image/png';
        var response = await fetch('https://api.anthropic.com/v1/messages', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            model: 'claude-sonnet-4-6',
            max_tokens: 1000,
            messages: [{
              role: 'user',
              content: [
                { type: 'image', source: { type: 'base64', media_type: mediaType, data: base64 } },
                { type: 'text', text: 'Recreate this landing page design as static HTML. Respond with ONLY raw HTML — no <html>, <head>, or <body> tags, no markdown code fences, no explanation before or after. Include one <style> block scoped to unique class names for all colors, layout, spacing and fonts. Every button or call-to-action must be a plain <a href="#">Label text</a> element. Keep each distinct piece of visible text as its own simple element with no deep nesting, so it can be edited individually afterward.' }
              ]
            }]
          })
        });
        if(!response.ok){ throw new Error('API request failed (' + response.status + ')'); }
        var data = await response.json();
        var textBlock = (data.content || []).find(function(c){ return c.type === 'text'; });
        if(!textBlock || !textBlock.text){ throw new Error('No design came back — try again.'); }
        var html = textBlock.text.trim().replace(/^```html?\s*/i, '').replace(/```\s*$/,'').trim();
        document.getElementById('customHtmlInput').value = html;
        applyCustomHTML();
        s.textContent = 'Done — layout inserted into Page HTML below. Review it, then keep editing as usual.';
        s.className = 'field-status ok';
      } catch(err){
        s.textContent = 'Could not generate a design: ' + err.message;
        s.className = 'field-status err';
      } finally {
        btn.disabled = false;
      }
    }

    function extractPageMarkup(raw){
      // If someone pastes a whole page's source (doctype/html/head/body, scripts,
      // wp-emoji-loader.js and all), pull out just the useful bits: any <style>
      // rules plus the body markup, with <script> tags stripped since they never
      // execute when injected via innerHTML anyway.
      if(!/<html[\s>]|<body[\s>]/i.test(raw)) return raw;
      try{
        var doc = new DOMParser().parseFromString(raw, 'text/html');
        if(!doc.body) return raw;
        // Dedupe by content: some sources repeat the exact same <style> block
        // twice (e.g. once in <head>, once elsewhere) — keep only the first.
        var seenStyles = {};
        var uniqueStyles = [];
        Array.prototype.forEach.call(doc.querySelectorAll('style'), function(st){
          var key = st.textContent.replace(/\s+/g, ' ').trim();
          if(seenStyles[key]) return;
          seenStyles[key] = true;
          uniqueStyles.push(st.outerHTML);
        });
        var styles = uniqueStyles.join('\n');
        Array.prototype.forEach.call(doc.body.querySelectorAll('script, noscript'), function(sc){ sc.remove(); });
        return (styles ? styles + '\n' : '') + doc.body.innerHTML.trim();
      } catch(e){
        return raw;
      }
    }

    function sanitizeTrackingConflicts(container){
      // Whatever gets pasted here in future — strip any tracking it brought
      // with it, so OUR pixel/dedup/currency setup is always the only thing
      // firing. Prevents duplicate or foreign Lead/Subscribe/PageView events.
      var removedOnclicks = 0, removedPixelImgs = 0, removedScripts = 0;
      Array.prototype.forEach.call(container.querySelectorAll('[onclick]'), function(el){
        var oc = el.getAttribute('onclick') || '';
        if(/fbq\s*\(/.test(oc)){
          el.removeAttribute('onclick');
          removedOnclicks++;
        }
      });
      Array.prototype.forEach.call(container.querySelectorAll('img[src*="facebook.com/tr"]'), function(img){
        img.remove();
        removedPixelImgs++;
      });
      Array.prototype.forEach.call(container.querySelectorAll('script'), function(sc){
        // Inert anyway once inserted via innerHTML, but keep the source clean.
        sc.remove();
        removedScripts++;
      });
      return { removedOnclicks: removedOnclicks, removedPixelImgs: removedPixelImgs, removedScripts: removedScripts };
    }

    function applyCustomHTML(){
      var raw = document.getElementById('customHtmlInput').value;
      var s = document.getElementById('status_customhtml');
      var pageContent = document.getElementById('pageContent');
      if(!raw.trim()){
        pageContent.innerHTML = '';
        document.getElementById('fieldList').innerHTML = '';
        s.textContent = 'Page cleared — paste new HTML above to rebuild it.';
        s.className = 'field-status';
        return;
      }
      var val = extractPageMarkup(raw);
      if(val !== raw){
        document.getElementById('customHtmlInput').value = val; // show the cleaned-up version
      }
      pageContent.innerHTML = val;
      var cleaned = sanitizeTrackingConflicts(pageContent);
      autoTagTextFields(pageContent);
      rebindPageContent();
      var joinCount = getPageButtons().length;
      var cleanedParts = [];
      if(cleaned.removedOnclicks) cleanedParts.push(cleaned.removedOnclicks + ' inline tracking call' + (cleaned.removedOnclicks > 1 ? 's' : ''));
      if(cleaned.removedPixelImgs) cleanedParts.push(cleaned.removedPixelImgs + ' foreign pixel image' + (cleaned.removedPixelImgs > 1 ? 's' : ''));
      var cleanedNote = cleanedParts.length ? (' Removed ' + cleanedParts.join(' and ') + ' so only your Pixel ID tracks.') : '';
      s.textContent = joinCount
        ? 'Updated — ' + joinCount + ' button' + (joinCount > 1 ? 's' : '') + ' detected and tracking attached.' + (val !== raw ? ' Cleaned up a full page source into just the visible markup.' : '') + cleanedNote
        : 'Updated — no buttons or links found in this HTML.' + cleanedNote;
      s.className = joinCount ? 'field-status ok' : 'field-status err';
    }

    function clearCustomHTML(){
      clearTimeout(customHtmlTimer);
      document.getElementById('customHtmlInput').value = '';
      applyCustomHTML();
      document.getElementById('customHtmlInput').focus();
    }

    var customHtmlTimer = null;
    document.getElementById('customHtmlInput').addEventListener('input', function(){
      clearTimeout(customHtmlTimer);
      var s = document.getElementById('status_customhtml');
      s.textContent = 'Editing…';
      s.className = 'field-status';
      customHtmlTimer = setTimeout(applyCustomHTML, 700);
    });

    function applyField(fieldId){
      var val = document.getElementById('ta_'+fieldId).value;
      document.querySelector('[data-field="' + fieldId + '"]').textContent = val;
      var s = document.getElementById('status_'+fieldId);
      s.textContent = 'Applied.';
      s.className = 'field-status ok';
    }

    function clearField(fieldId){
      document.getElementById('ta_'+fieldId).value = '';
      document.getElementById('ta_'+fieldId).focus();
    }

    async function callClaude(prompt){
      var response = await fetch("https://api.anthropic.com/v1/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 500, messages: [{ role: "user", content: prompt }] })
      });
      var data = await response.json();
      var textBlock = (data.content || []).find(function(b){ return b.type === 'text'; });
      return textBlock ? textBlock.text.trim() : '';
    }

    async function translateField(fieldId, mode){
      var textarea = document.getElementById('ta_'+fieldId);
      var statusEl = document.getElementById('status_'+fieldId);
      statusEl.textContent = 'Translating…';
      statusEl.className = 'field-status';
      try{
        var src = textarea.value;
        var instruction = mode === 'ta'
          ? 'Translate this short marketing/UI line into natural Tamil (Tamil script). Keep brand names, numbers, emoji and links unchanged. Return ONLY the translated line, nothing else:\n\n"' + src + '"'
          : 'Rewrite this short marketing/UI line into casual Tanglish (Tamil words spelled in Roman script, mixed naturally with English as commonly used in Tamil Nadu social media ads). Keep brand names, numbers, emoji and links unchanged. Return ONLY the result, nothing else:\n\n"' + src + '"';
        var result = await callClaude(instruction);
        textarea.value = result;
        applyField(fieldId);
        statusEl.textContent = 'Translated & applied.';
        statusEl.className = 'field-status ok';
      }catch(e){
        statusEl.textContent = 'Failed: ' + e.message;
        statusEl.className = 'field-status err';
      }
    }

    function generateFinalCode(){
      document.body.setAttribute('data-redirect-enabled', document.getElementById('enableRedirectCheckbox').checked ? 'true' : 'false');

      var clone = document.documentElement.cloneNode(true);
      clone.removeAttribute('id');
      if(clone.querySelector('body')) clone.querySelector('body').removeAttribute('id');
      var toggle = clone.querySelector('#editToggle');
      var panel = clone.querySelector('#editPanel');
      if(toggle) toggle.remove();
      if(panel) panel.remove();

      var html = '<!DOCTYPE html>\n' + clone.outerHTML;

      var section = document.getElementById('finalCodeSection');
      var output = document.getElementById('finalCodeOutput');
      output.value = html;
      section.style.display = 'block';
      output.focus();
      output.select();
      section.scrollIntoView({behavior:'smooth', block:'nearest'});

      var logoImgFinal = document.getElementById('logoImg');
      var logoSrc = logoImgFinal ? (logoImgFinal.getAttribute('src') || '') : '';
      var s = document.getElementById('status_finalcode');
      var notes = [];
      if(logoSrc.indexOf('data:') === 0){
        var approxKB = Math.round(logoSrc.length * 0.75 / 1024);
        notes.push('✓ Image embedded (~' + approxKB + ' KB)');
      } else {
        notes.push('⚠ No image uploaded — logo will be blank');
      }
      if(CONFIG.pixelId){
        notes.push('✓ Pixel ID set — Lead & Subscribe events will fire on click');
      } else {
        notes.push('⚠ No Pixel ID set — tracking will stay silent until you add one');
      }
      s.textContent = notes.join('. ') + '. Total code: ' + html.length.toLocaleString() + ' characters. Tap Copy.';
      s.className = (logoSrc.indexOf('data:') === 0 && CONFIG.pixelId) ? 'field-status ok' : 'field-status err';
    }

    function copyFinalCode(){
      var output = document.getElementById('finalCodeOutput');
      var s = document.getElementById('status_finalcode');
      output.focus();
      output.select();
      try{
        navigator.clipboard.writeText(output.value).then(function(){
          s.textContent = 'Copied to clipboard.';
          s.className = 'field-status ok';
        }).catch(function(){
          fallbackCopy(s);
        });
      }catch(e){
        fallbackCopy(s);
      }
    }

    function fallbackCopy(s){
      try{
        document.execCommand('copy');
        s.textContent = 'Copied to clipboard.';
        s.className = 'field-status ok';
      }catch(e){
        s.textContent = 'Auto-copy blocked here — box is selected, just press Copy manually.';
        s.className = 'field-status err';
      }
    }

    window.applyTelegramLink = applyTelegramLink;
    window.applyPixelId = applyPixelId;
    window.applyEventValue = applyEventValue;
    window.applyField = applyField;
    window.clearField = clearField;
    window.translateField = translateField;
    window.applyCustomHTML = applyCustomHTML;
    window.clearCustomHTML = clearCustomHTML;
    window.redesignFromScreenshot = redesignFromScreenshot;
    window.applyButtonLink = applyButtonLink;
    window.useTelegramForButton = useTelegramForButton;
    window.generateFinalCode = generateFinalCode;
    window.copyFinalCode = copyFinalCode;

    // Auto-tag on initial load too — not just after a Page HTML edit — so a
    // page you paste into the file directly (like this one) is fully
    // editable/translatable from the start, no manual tagging or re-paste needed.
    autoTagTextFields(document.getElementById('pageContent'));
    buildButtonPanel();
    buildFieldPanel();
  }
